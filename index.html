<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메모장</title><style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:600px;background:white;color:#222;font:16px system-ui}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;max-width:100%}input,textarea{display:block;width:100%;margin:10px 0}button{cursor:pointer;margin:4px}textarea{min-height:120px}p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px}button:disabled{cursor:wait}</style><h1>메모장</h1><section id="auth"><form id="authForm"><label>이메일<input id="email" type="email" autocomplete="email" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button name="action" value="login">로그인</button><button name="action" value="signup">회원가입</button></form></section><section id="app" hidden><div id="user"></div><button id="logout">로그아웃</button><form id="memoForm"><label>메모 내용<textarea id="content" required></textarea></label><button>저장</button></form><div id="list"></div></section><div id="status" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>
const db=supabase.createClient('https://ddrmcukqqvdgyukauzvh.supabase.co','sb_publishable_MCyQtniyGQxRUR2ROwuuaA_e-iSQFWe',{auth:{persistSession:true,autoRefreshToken:true}});const el=id=>document.getElementById(id);let session=null,busy=false;
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);el('status').textContent='처리 중…';try{await fn();el('status').textContent='';}catch(e){el('status').textContent='오류: '+e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function load(){const uid=session?.user.id;if(!uid)return;const {data,error}=await db.from('memos').select('*').order('created_at',{ascending:false});if(error)throw error;if(session?.user.id!==uid)return;el('list').replaceChildren();if(!data.length)el('list').textContent='저장한 메모가 없어.';for(const memo of data){const card=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');p.textContent=memo.content;b.textContent='삭제';b.onclick=()=>run(async()=>{const {error}=await db.from('memos').delete().eq('id',memo.id);if(error)throw error;await load();});card.append(p,b);el('list').append(card);}}
function show(s){session=s;el('auth').hidden=!!s;el('app').hidden=!s;el('user').textContent=s?.user.email||'';el('list').replaceChildren();if(!s)el('content').value='';}
el('authForm').onsubmit=e=>{e.preventDefault();const action=e.submitter.value;run(async()=>{const credentials={email:el('email').value.trim(),password:el('password').value};const {data,error}=action==='signup'?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);if(error)throw error;el('password').value='';if(!data.session)throw Error('이메일 확인 설정이 켜져 있어. 실습 프로젝트의 Confirm email 설정을 꺼야 해.');show(data.session);await load();});};
el('memoForm').onsubmit=e=>{e.preventDefault();run(async()=>{const content=el('content').value.trim();if(!content)throw Error('메모 내용을 입력해 줘.');const {error}=await db.from('memos').insert({user_id:session.user.id,content});if(error)throw error;el('content').value='';await load();});};el('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;show(null);});db.auth.onAuthStateChange((_event,s)=>{show(s);if(s)setTimeout(()=>run(load),0);});run(async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;show(data.session);await load();});
</script></html>
